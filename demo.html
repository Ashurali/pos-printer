<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldPOS - Demo Toko Emas</title>
  <style>
    :root {
      --gold: #c9a84c;
      --gold-dark: #a88930;
      --bg: #f8f6f0;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e1d8;
      --success: #16a34a;
      --danger: #dc2626;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .header {
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header h1 span { color: var(--gold); }
    .header-badge {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all .15s;
    }
    .header-badge.disconnected { background: rgba(220,38,38,.2); color: #fca5a5; }
    .header-badge.connected { background: rgba(22,163,74,.2); color: #86efac; }

    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      border: none;
      background: transparent;
      color: var(--muted);
    }
    .tab.active { background: var(--gold); color: #fff; }
    .tab:hover:not(.active) { background: #f3f0e8; }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
    }
    .card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input, select, textarea {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus { border-color: var(--gold); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-gold { background: var(--gold); color: #fff; }
    .btn-gold:hover:not(:disabled) { background: var(--gold-dark); }
    .btn-green { background: #059669; color: #fff; }
    .btn-green:hover:not(:disabled) { background: #047857; }
    .btn-gray { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .btn-gray:hover:not(:disabled) { background: #e2e8f0; }
    .btn-red { background: #ef4444; color: #fff; }
    .btn-red:hover:not(:disabled) { background: #dc2626; }
    .btn-sm { padding: 6px 14px; font-size: 13px; }
    .btn-block { width: 100%; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; padding: 8px 4px; border-bottom: 2px solid var(--border); }
    td { padding: 8px 4px; border-bottom: 1px solid #f1f5f9; }
    td input, td select { width: 100%; }

    .summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
    .summary-row.total { font-size: 20px; font-weight: 700; border-top: 2px solid var(--text); padding-top: 12px; margin-top: 4px; }

    .receipt-preview {
      background: #fff;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-width: 380px;
      margin: 0 auto;
    }
    .receipt-preview .rp-center { text-align: center; }
    .receipt-preview .rp-bold { font-weight: 700; }
    .receipt-preview .rp-large { font-size: 18px; }
    .receipt-preview .rp-sep { border-top: 1px dashed #ccc; margin: 8px 0; }
    .receipt-preview .rp-row { display: flex; justify-content: space-between; }
    .receipt-preview .rp-item-detail { color: #666; font-size: 12px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

    #printer-setup-container { max-width: 480px; margin: 0 auto; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      z-index: 1000;
      animation: slideIn .3s ease;
      max-width: 360px;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

  <div class="header">
    <h1>💎 <span>Gold</span>POS</h1>
    <div class="header-badge disconnected" id="header-badge" title="Klik untuk hubungkan printer">
      ● Printer Offline
    </div>
  </div>

  <div class="container">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="pos">🛒 Kasir</button>
      <button class="tab" data-tab="printer">🖨️ Printer</button>
      <button class="tab" data-tab="history">📋 Riwayat</button>
    </div>

    <!-- ============ POS Panel ============ -->
    <div class="panel active" id="panel-pos">
      <div class="card">
        <h3>📦 Daftar Barang</h3>
        <table>
          <thead>
            <tr>
              <th>Nama Item</th>
              <th style="width:80px">Berat(g)</th>
              <th style="width:75px">Karat</th>
              <th style="width:130px">Harga</th>
              <th style="width:55px">Qty</th>
              <th style="width:120px;text-align:right">Subtotal</th>
              <th style="width:30px"></th>
            </tr>
          </thead>
          <tbody id="pos-items"></tbody>
        </table>
        <button class="btn btn-gray btn-sm" id="btn-add-item" style="margin-top:12px">+ Tambah Barang</button>
      </div>

      <div class="grid-2">
        <div class="card">
          <h3>💰 Ringkasan</h3>
          <div class="summary-row"><span>Subtotal</span><span id="pos-subtotal">Rp 0</span></div>
          <div class="summary-row">
            <span>Diskon</span>
            <input type="number" id="pos-discount" value="0" min="0" step="1000" style="width:120px;text-align:right">
          </div>
          <div class="summary-row">
            <span>Pajak (PPN)</span>
            <input type="number" id="pos-tax" value="0" min="0" step="1000" style="width:120px;text-align:right">
          </div>
          <div class="summary-row total"><span>TOTAL</span><span id="pos-total">Rp 0</span></div>
        </div>

        <div class="card">
          <h3>💳 Pembayaran</h3>
          <div style="margin-bottom:12px">
            <label style="font-size:13px;color:var(--muted);display:block;margin-bottom:4px">Metode</label>
            <select id="pos-method" style="width:100%">
              <option value="cash">Tunai</option>
              <option value="debit">Debit</option>
              <option value="credit">Kartu Kredit</option>
              <option value="transfer">Transfer</option>
            </select>
          </div>
          <div style="margin-bottom:12px">
            <label style="font-size:13px;color:var(--muted);display:block;margin-bottom:4px">Jumlah Bayar</label>
            <input type="number" id="pos-paid" value="0" min="0" step="1000" style="width:100%;font-size:18px;font-weight:700">
          </div>
          <div class="summary-row" id="pos-change-row">
            <span>Kembalian</span>
            <span id="pos-change" style="font-weight:700;color:var(--success)">Rp 0</span>
          </div>
        </div>
      </div>

      <div class="btn-group" style="margin-top:8px">
        <button class="btn btn-gold btn-block" id="btn-pay" style="flex:1;font-size:16px;padding:14px">
          💰 Proses Pembayaran
        </button>
        <button class="btn btn-green btn-block" id="btn-print-pay" style="flex:1;font-size:16px;padding:14px">
          🖨️ Bayar & Print
        </button>
      </div>

      <!-- Receipt Preview (shown after payment) -->
      <div id="receipt-section" style="display:none;margin-top:24px">
        <div class="card">
          <h3>🧾 Struk</h3>
          <div class="receipt-preview" id="receipt-html"></div>
          <div class="btn-group" style="margin-top:16px;justify-content:center">
            <button class="btn btn-gold btn-sm" id="btn-reprint">🖨️ Print Ulang</button>
            <button class="btn btn-gray btn-sm" id="btn-open-drawer">💵 Buka Laci</button>
            <button class="btn btn-green btn-sm" id="btn-new-txn">➕ Transaksi Baru</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ Printer Panel ============ -->
    <div class="panel" id="panel-printer">
      <div id="printer-setup-container"></div>
    </div>

    <!-- ============ History Panel ============ -->
    <div class="panel" id="panel-history">
      <div class="card">
        <h3>📋 Riwayat Transaksi Hari Ini</h3>
        <div id="history-list" style="font-size:14px">
          <p style="color:var(--muted);text-align:center;padding:24px 0">Belum ada transaksi hari ini</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Include JS modules (in production, use bundled files) -->
  <script src="lib/assets/javascripts/printer-manager.js"></script>
  <script src="lib/assets/javascripts/printer-setup.js"></script>

  <script>
    // ========================================================================
    // GoldPOS Demo Application
    // ========================================================================
    (function() {
      'use strict';

      // --- State ---
      let currentTotal = 0;
      let salesHistory = JSON.parse(localStorage.getItem('goldpos_sales') || '[]');

      // --- Printer ---
      const printer = new PrinterManager({ paperWidth: '80mm' });
      const badge = document.getElementById('header-badge');

      printer.on('connected', (info) => {
        badge.className = 'header-badge connected';
        badge.textContent = '● ' + info.name;
        showToast('Printer terhubung: ' + info.name, 'success');
      });
      printer.on('disconnected', () => {
        badge.className = 'header-badge disconnected';
        badge.textContent = '● Printer Offline';
      });
      printer.on('error', (e) => showToast('Error: ' + e.message, 'error'));

      badge.addEventListener('click', () => {
        if (!printer.isConnected) printer.connect().catch(() => {});
      });

      // --- Printer Setup Widget ---
      if (typeof PrinterSetup !== 'undefined') {
        new PrinterSetup(document.getElementById('printer-setup-container'), {
          printerManager: printer,
        });
      }

      // --- Tabs ---
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        });
      });

      // --- POS Items ---
      let itemIdx = 0;
      const itemsBody = document.getElementById('pos-items');

      function addItemRow() {
        const i = itemIdx++;
        const tr = document.createElement('tr');
        tr.dataset.idx = i;
        tr.innerHTML = `
          <td><input type="text" placeholder="Cincin Emas" class="item-name"></td>
          <td><input type="number" step="0.001" min="0" placeholder="5.0" class="item-weight"></td>
          <td>
            <select class="item-karat">
              <option>24K</option><option>22K</option><option>18K</option>
              <option>14K</option><option>10K</option><option>9K</option>
            </select>
          </td>
          <td><input type="number" min="0" step="1000" placeholder="5500000" class="item-price"></td>
          <td><input type="number" min="1" value="1" class="item-qty"></td>
          <td style="text-align:right;font-weight:600" class="item-linetotal">Rp 0</td>
          <td style="text-align:center">
            <button class="btn-remove" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:18px">&times;</button>
          </td>
        `;
        itemsBody.appendChild(tr);
        tr.querySelector('.item-price').addEventListener('input', recalc);
        tr.querySelector('.item-qty').addEventListener('input', recalc);
        tr.querySelector('.btn-remove').addEventListener('click', () => {
          if (itemsBody.querySelectorAll('tr').length > 1) { tr.remove(); recalc(); }
        });
      }

      document.getElementById('btn-add-item').addEventListener('click', addItemRow);
      addItemRow(); // start with one

      // --- Recalc ---
      function recalc() {
        let subtotal = 0;
        itemsBody.querySelectorAll('tr').forEach(tr => {
          const p = parseFloat(tr.querySelector('.item-price')?.value) || 0;
          const q = parseInt(tr.querySelector('.item-qty')?.value) || 1;
          const lt = p * q;
          subtotal += lt;
          tr.querySelector('.item-linetotal').textContent = formatRp(lt);
        });
        const disc = parseFloat(document.getElementById('pos-discount').value) || 0;
        const tax = parseFloat(document.getElementById('pos-tax').value) || 0;
        currentTotal = subtotal - disc + tax;
        const paid = parseFloat(document.getElementById('pos-paid').value) || 0;

        document.getElementById('pos-subtotal').textContent = formatRp(subtotal);
        document.getElementById('pos-total').textContent = formatRp(currentTotal);
        document.getElementById('pos-change').textContent = formatRp(Math.max(0, paid - currentTotal));
      }

      ['pos-discount', 'pos-tax', 'pos-paid'].forEach(id =>
        document.getElementById(id).addEventListener('input', recalc)
      );
      document.getElementById('pos-method').addEventListener('change', () => {
        document.getElementById('pos-change-row').style.display =
          document.getElementById('pos-method').value === 'cash' ? 'flex' : 'none';
      });

      function formatRp(n) { return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }

      // --- Collect Receipt Data ---
      function collectReceiptData() {
        const items = [];
        let subtotal = 0;
        itemsBody.querySelectorAll('tr').forEach(tr => {
          const name = tr.querySelector('.item-name')?.value || 'Item';
          const weight = parseFloat(tr.querySelector('.item-weight')?.value) || 0;
          const karat = tr.querySelector('.item-karat')?.value || '24K';
          const price = parseFloat(tr.querySelector('.item-price')?.value) || 0;
          const qty = parseInt(tr.querySelector('.item-qty')?.value) || 1;
          subtotal += price * qty;
          items.push({ name, weight, karat, price, qty });
        });

        const discount = parseFloat(document.getElementById('pos-discount').value) || 0;
        const tax = parseFloat(document.getElementById('pos-tax').value) || 0;
        const total = subtotal - discount + tax;
        const paid = parseFloat(document.getElementById('pos-paid').value) || 0;
        const method = document.getElementById('pos-method').value;

        return {
          store: { name: 'TOKO EMAS SEJAHTERA', address: 'Jl. Pasar Baru No. 123, Jakarta', phone: '021-5551234' },
          invoiceNo: PrinterManager.generateInvoiceNumber('INV'),
          cashierName: 'Admin',
          items,
          subtotal,
          discount,
          tax,
          total,
          paid,
          change: Math.max(0, paid - total),
          paymentMethod: method,
          footer: 'Terima Kasih atas Kunjungan Anda!',
        };
      }

      // --- Process Payment ---
      function processPayment(shouldPrint) {
        const data = collectReceiptData();

        if (data.items.length === 0 || data.items.every(i => !i.name && !i.price)) {
          showToast('Tambahkan minimal satu barang', 'error');
          return;
        }
        if (data.paymentMethod === 'cash' && data.paid < data.total) {
          showToast('Jumlah bayar kurang dari total', 'error');
          return;
        }

        // Save to history
        const record = { ...data, timestamp: new Date().toISOString() };
        salesHistory.unshift(record);
        localStorage.setItem('goldpos_sales', JSON.stringify(salesHistory.slice(0, 100)));

        // Show receipt preview
        renderReceiptHTML(data);
        document.getElementById('receipt-section').style.display = 'block';
        document.getElementById('receipt-section').scrollIntoView({ behavior: 'smooth' });

        // Print if requested
        if (shouldPrint && printer.isConnected) {
          printer.printReceipt(data).then(() => {
            printer.openCashDrawer().catch(() => {});
          }).catch(e => showToast('Print gagal: ' + e.message, 'error'));
        } else if (shouldPrint && !printer.isConnected) {
          showToast('Printer tidak terhubung. Struk tersimpan.', 'error');
        }

        showToast('Transaksi berhasil! ' + data.invoiceNo, 'success');
        updateHistory();
      }

      document.getElementById('btn-pay').addEventListener('click', () => processPayment(false));
      document.getElementById('btn-print-pay').addEventListener('click', () => processPayment(true));

      document.getElementById('btn-reprint').addEventListener('click', async () => {
        if (!printer.isConnected) {
          try { await printer.connect(); } catch(e) { showToast('Gagal terhubung ke printer', 'error'); return; }
        }
        const data = collectReceiptData();
        await printer.printReceipt(data);
      });

      document.getElementById('btn-open-drawer').addEventListener('click', async () => {
        if (!printer.isConnected) {
          try { await printer.connect(); } catch(e) { showToast('Gagal terhubung', 'error'); return; }
        }
        await printer.openCashDrawer();
      });

      document.getElementById('btn-new-txn').addEventListener('click', () => {
        document.getElementById('receipt-section').style.display = 'none';
        itemsBody.innerHTML = '';
        itemIdx = 0;
        addItemRow();
        document.getElementById('pos-discount').value = 0;
        document.getElementById('pos-tax').value = 0;
        document.getElementById('pos-paid').value = 0;
        recalc();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // --- Receipt HTML ---
      function renderReceiptHTML(data) {
        const el = document.getElementById('receipt-html');
        let html = `
          <div class="rp-center rp-bold rp-large">${data.store.name}</div>
          <div class="rp-center" style="font-size:11px;color:#888">${data.store.address}</div>
          <div class="rp-center" style="font-size:11px;color:#888">Telp: ${data.store.phone}</div>
          <div class="rp-sep"></div>
          <div class="rp-row"><span>No: ${data.invoiceNo}</span><span>${new Date().toLocaleString('id-ID')}</span></div>
          <div style="font-size:12px;color:#888">Kasir: ${data.cashierName}</div>
          <div class="rp-sep"></div>
        `;
        for (const item of data.items) {
          html += `
            <div class="rp-bold">${item.name}</div>
            <div class="rp-row rp-item-detail">
              <span>&nbsp;&nbsp;${item.weight}g | ${item.karat} | x${item.qty}</span>
              <span>${formatRp(item.price * item.qty)}</span>
            </div>
          `;
        }
        html += `<div class="rp-sep"></div>`;
        html += `<div class="rp-row"><span>Subtotal</span><span>${formatRp(data.subtotal)}</span></div>`;
        if (data.discount > 0) html += `<div class="rp-row" style="color:#dc2626"><span>Diskon</span><span>- ${formatRp(data.discount)}</span></div>`;
        if (data.tax > 0) html += `<div class="rp-row"><span>Pajak</span><span>${formatRp(data.tax)}</span></div>`;
        html += `<div class="rp-sep" style="border-top-style:double"></div>`;
        html += `<div class="rp-row rp-bold" style="font-size:18px"><span>TOTAL</span><span>${formatRp(data.total)}</span></div>`;
        html += `<div class="rp-sep"></div>`;
        const methodNames = { cash: 'Tunai', debit: 'Debit', credit: 'Kartu Kredit', transfer: 'Transfer' };
        html += `<div class="rp-row"><span>Pembayaran</span><span>${methodNames[data.paymentMethod]}</span></div>`;
        html += `<div class="rp-row"><span>Dibayar</span><span>${formatRp(data.paid)}</span></div>`;
        if (data.paymentMethod === 'cash') {
          html += `<div class="rp-row rp-bold"><span>Kembali</span><span>${formatRp(data.change)}</span></div>`;
        }
        html += `
          <div class="rp-sep"></div>
          <div class="rp-center" style="margin-top:12px;font-size:12px;color:#888">${data.footer}</div>
          <div class="rp-center" style="font-size:11px;color:#aaa">Barang yang sudah dibeli tidak dapat dikembalikan</div>
        `;
        el.innerHTML = html;
      }

      // --- History ---
      function updateHistory() {
        const el = document.getElementById('history-list');
        const todaySales = salesHistory.filter(s => {
          const d = new Date(s.timestamp);
          const today = new Date();
          return d.toDateString() === today.toDateString();
        });

        if (todaySales.length === 0) {
          el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:24px 0">Belum ada transaksi hari ini</p>';
          return;
        }

        let html = '<table><thead><tr><th>Invoice</th><th>Waktu</th><th>Items</th><th style="text-align:right">Total</th></tr></thead><tbody>';
        for (const s of todaySales) {
          const time = new Date(s.timestamp).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
          html += `<tr>
            <td style="font-weight:600;font-size:12px">${s.invoiceNo}</td>
            <td>${time}</td>
            <td>${s.items.length} item</td>
            <td style="text-align:right;font-weight:600">${formatRp(s.total)}</td>
          </tr>`;
        }
        const totalSales = todaySales.reduce((sum, s) => sum + s.total, 0);
        html += `</tbody><tfoot><tr style="border-top:2px solid var(--border)">
          <td colspan="3" style="font-weight:700;padding-top:12px">Total Penjualan</td>
          <td style="text-align:right;font-weight:700;font-size:16px;padding-top:12px">${formatRp(totalSales)}</td>
        </tr></tfoot></table>`;
        el.innerHTML = html;
      }
      updateHistory();

      // --- Toast ---
      function showToast(msg, type) {
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        t.textContent = msg;
        document.getElementById('toast-container').appendChild(t);
        setTimeout(() => t.remove(), 4000);
      }

    })();
  </script>
</body>
</html>
